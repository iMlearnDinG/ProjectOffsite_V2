<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | deadcity.io</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- AdSense Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2365517975623741" crossorigin="anonymous"></script>
    <style>
        body {
            background: url('Build/background-image2.png') no-repeat center center;
            background-size: cover; /* Scales image to cover viewport */
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Prevent scrollbars */
        }

        #unity-container {
            background: transparent;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Center container */
            width: 100vw;
            height: 100vh;
            max-width: 1920px; /* Cap maximum size */
            max-height: 1080px; /* Cap maximum size */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            width: 100%; /* Fill container */
            height: 100%; /* Fill container */
            max-width: 100%;
            max-height: 100%;
        }

        .ad-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-fullscreen-button"></div>
        </div>
    </div>

    <!-- AdSense Ad Unit (ad-banner-bottom) -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2365517975623741"
             data-ad-slot="4468358463"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        var canvas = document.querySelector("#unity-canvas");

        // Shows a temporary message banner/ribbon for a few seconds, or
        // a permanent error message on top of the canvas if type=='error'.
        // If type=='warning', a yellow highlight color is used.
        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/702ce58b430a5b5d2551ad50cc2dd54f.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/53370564c091f8a12d7af967bfb9a72e.data.unityweb",
            frameworkUrl: buildUrl + "/c3cbac7a3c5f147ff1e083d6279dbadf.framework.js.unityweb",
            codeUrl: buildUrl + "/c0b34d3eab1e36723d132d8bce7259c8.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "BigFatDog",
            productName: "deadcity.io",
            productVersion: "1.0.0.028",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true // Ensure Unity matches canvas size
        };

        // Function to resize the canvas to match the container
        function resizeCanvas() {
            var container = document.querySelector("#unity-container");
            canvas.style.width = container.clientWidth + "px";
            canvas.style.height = container.clientHeight + "px";
        }

        // Initial resize
        resizeCanvas();

        // Resize on window resize
        window.addEventListener("resize", resizeCanvas);

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device: Fullscreen canvas
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
            // Optional: Lower resolution for performance
            // config.devicePixelRatio = 1;
        } else {
            // Desktop: Canvas size handled by CSS and resizeCanvas
            document.querySelector("#unity-container").className = "unity-desktop";
        }

        // Set canvas background to transparent to show body background
        canvas.style.background = "transparent";
        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
                // Ensure canvas resizes after Unity loads
                resizeCanvas();
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
