<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | deadcity.io</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- AdSense Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2365517975623741" crossorigin="anonymous"></script>
    <style>
        body {
            background: url('Build/background-image2.png') no-repeat center center;
            background-size: cover; /* Scales image to cover viewport */
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Prevent scrollbars */
        }

        #unity-container {
            background: transparent;
            position: absolute;
            top: 50%; /* Center vertically */
            left: 50%; /* Center horizontally */
            transform: translate(-50%, -50%); /* Center container */
            width: 50vw; /* Default width */
            max-width: 1280px; /* Cap maximum size (2x original 640px) */
            aspect-ratio: 2 / 1; /* Maintain 640x320 aspect ratio */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            width: 100%; /* Fill container */
            height: 100%; /* Fill container */
        }

        #unity-footer {
            position: absolute;
            bottom: -40px; /* Position below the canvas (adjust as needed) */
            left: 50%;
            transform: translateX(-50%); /* Center horizontally */
            width: 100%;
            text-align: center;
        }

        #unity-fullscreen-button {
            display: inline-block;
            margin: 0px auto; /* Add some spacing */
        }

        .ad-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            /* Responsive height based on viewport */
            height: 15vh; /* 15% of viewport height */
            min-height: 80px; /* Minimum height for usability */
            max-height: 110px; /* Maximum height for desktop */
        }

        /* Constrain the ad unit size */
        .adsbygoogle {
            display: block !important; /* Ensure block display */
            width: 100% !important; /* Fill container */
            max-width: 728px !important; /* Cap at standard leaderboard width */
            min-width: 320px !important; /* Minimum width for mobile */
            height: auto !important; /* Let height adjust dynamically */
            max-height: calc(15vh - 20px) !important; /* Match container height minus padding */
            min-height: 60px !important; /* Minimum ad height */
            margin: 0 auto !important; /* Center the ad within the container */
        }

        /* Mobile-specific styles (max-width 768px) */
        @media only screen and (max-width: 768px) {
            #unity-container {
                width: 90vw; /* Wider on mobile to use more screen space */
                max-width: 640px; /* Cap at original canvas size */
            }

            .ad-container {
                height: 12vh; /* Smaller percentage on mobile */
                min-height: 60px; /* Reduced minimum height */
                max-height: 80px; /* Reduced maximum height */
                padding: 5px 0; /* Reduced padding */
            }

            .adsbygoogle {
                max-height: calc(12vh - 10px) !important; /* Match container height minus padding */
                min-height: 50px !important; /* Reduced minimum ad height */
                min-width: 300px !important; /* Slightly smaller min-width for smaller screens */
            }

            #unity-footer {
                bottom: -30px; /* Adjust footer position for smaller ad height */
            }
        }

        /* Extra small viewports (height less than 500px) */
        @media only screen and (max-height: 500px) {
            .ad-container {
                height: 10vh; /* Even smaller percentage for very short viewports */
                min-height: 50px; /* Further reduced minimum height */
                max-height: 60px; /* Further reduced maximum height */
                padding: 5px 0;
            }

            .adsbygoogle {
                max-height: calc(10vh - 10px) !important; /* Match container height minus padding */
                min-height: 40px !important; /* Further reduced minimum ad height */
            }

            #unity-footer {
                bottom: -20px; /* Adjust footer position for smaller ad height */
            }
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-fullscreen-button"></div>
        </div>
    </div>

    <!-- AdSense Ad Unit (ad-banner-bottom) -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             data-ad-client="ca-pub-2365517975623741"
             data-ad-slot="4468358463"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/702ce58b430a5b5d2551ad50cc2dd54f.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/292aa72201771ea5c3f669a1fdeb345e.data.unityweb",
        frameworkUrl: buildUrl + "/c3cbac7a3c5f147ff1e083d6279dbadf.framework.js.unityweb",
        codeUrl: buildUrl + "/c0b34d3eab1e36723d132d8bce7259c8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BigFatDog",
        productName: "deadcity.io",
        productVersion: "1.0.0.028",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true // Ensure Unity matches canvas size
      };

      // Function to resize the canvas to match the container while preserving aspect ratio
      function resizeCanvas() {
        var container = document.querySelector("#unity-container");
        var footer = document.querySelector("#unity-footer");
        var adContainer = document.querySelector(".ad-container");
        var aspectRatio = 2 / 1; // Original aspect ratio (640x320)
        var containerWidth = Math.min(window.innerWidth * 0.5, 1280); // 50% of viewport width, capped at 1280px
        var containerHeight = containerWidth / aspectRatio; // Height based on aspect ratio

        // Ensure container doesn't exceed viewport height, accounting for ad banner
        var adHeight = adContainer.getBoundingClientRect().height;
        var availableHeight = window.innerHeight - adHeight; // Viewport height minus ad height
        if (containerHeight > availableHeight * 0.8) {
          containerHeight = availableHeight * 0.8;
          containerWidth = containerHeight * aspectRatio;
        }

        container.style.width = containerWidth + "px";
        container.style.height = containerHeight + "px";
        canvas.style.width = containerWidth + "px";
        canvas.style.height = containerHeight + "px";

        // Adjust top position to center within available space
        var topPosition = (availableHeight / 2 + adHeight) / window.innerHeight * 100;
        container.style.top = topPosition + "%";

        // Ensure footer stays below the canvas
        footer.style.bottom = "-40px"; // Match the CSS value

        // On mobile, apply additional adjustments
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.style.width = Math.min(window.innerWidth * 0.9, 640) + "px"; // Match media query
          containerHeight = containerWidth / aspectRatio;
          if (containerHeight > availableHeight * 0.8) {
            containerHeight = availableHeight * 0.8;
            containerWidth = containerHeight * aspectRatio;
          }
          container.style.width = containerWidth + "px";
          container.style.height = containerHeight + "px";
          canvas.style.width = containerWidth + "px";
          canvas.style.height = containerHeight + "px";
          topPosition = (availableHeight / 2 + adHeight) / window.innerHeight * 100;
          container.style.top = topPosition + "%";
        }
      }

      // Initial resize
      resizeCanvas();

      // Resize on window resize
      window.addEventListener("resize", resizeCanvas);

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device: Fullscreen canvas
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // Optional: Lower resolution for performance
        // config.devicePixelRatio = 1;
      } else {
        // Desktop: Canvas size handled by CSS and resizeCanvas
        document.querySelector("#unity-container").className = "unity-desktop";
      }

      canvas.style.background = "url('" + buildUrl + "/a4ec65f1e36639260e088d38a7fdfca1.jpg') center / cover";
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          // Ensure canvas resizes after Unity loads
          resizeCanvas();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
</body>
</html>
